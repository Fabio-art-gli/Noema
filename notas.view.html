<section>
  <h2>Mis Reflexiones</h2>
  <form id="nota-form">
    <input type="text" id="titulo-nota" placeholder="Título" required>
    <textarea id="contenido-nota" placeholder="Escribe tu reflexión..." required></textarea>
    <select id="tipo-nota">
      <option value="Emociones">Emociones</option>
      <option value="Experiencias">Experiencias</option>
      <option value="Aprendizajes">Aprendizajes</option>
      <option value="Pensamientos">Pensamientos</option>
      <option value="Autoconocimiento">Autoconocimiento</option>
    </select>
    <button type="submit">Guardar</button>
  </form>

  <div id="nota-lista"></div>
</section>
