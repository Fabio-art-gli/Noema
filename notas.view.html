<section>
  <h2>Reflexión personal</h2>
  <form id="nota-form">
    <textarea id="texto-nota" placeholder="¿Qué estás sintiendo o pensando hoy?" required></textarea>
    <select id="categoria-nota">
      <option value="Emoción">Emoción</option>
      <option value="Experiencia">Experiencia</option>
      <option value="Pensamiento">Pensamiento</option>
      <option value="Aprendizaje">Aprendizaje</option>
      <option value="Autoconocimiento">Autoconocimiento</option>
    </select>
    <button type="submit">Guardar nota</button>
  </form>
  <div id="nota-lista"></div>
</section>
